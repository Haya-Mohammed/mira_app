name: booking_app
description: "Mira salon booking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  dartz: ^0.10.1

  # DI
  get_it: ^7.7.0

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  logging: ^1.3.0

  flutter_dotenv: ^6.0.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  characters: ^1.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  image: ^4.12.0

flutter:

  uses-material-design: true
  generate: true

  assets:
   - .env
   - assets/images/logo.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
